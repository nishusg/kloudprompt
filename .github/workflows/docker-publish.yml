name: Build and Push KloudPrompt UI Docker Image

on:
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed


  workflow_dispatch:

jobs:
  build:
    # Don't build if Create Release failed.
    # Always allow manual workflow_dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch latest tag
        shell: bash
        shell: bash
        run: |
          git fetch --tags

          latest_tag=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "latest")

          echo "VERSION=$latest_tag" >> "$GITHUB_ENV"
          echo "Latest tag: $latest_tag"

          latest_tag=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "latest")

          echo "VERSION=$latest_tag" >> "$GITHUB_ENV"
          echo "Latest tag: $latest_tag"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          # Build for both AMD64 and ARM64
          platforms: linux/amd64,linux/arm64

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kloudprompt-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kloudprompt-ui:${{ env.VERSION }}

          # GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max